name: Build RepairForge

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (compiles, remaps, and runs any tests)
        run: ./gradlew build --stacktrace

      - name: Upload built jar(s)
        uses: actions/upload-artifact@v4
        with:
          name: repairforge-jars
          path: build/libs/*.jar
